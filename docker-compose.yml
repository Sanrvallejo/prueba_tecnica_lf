services:
  redis:
    image: redis:7-alpine

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull llama3.2 && ollama pull nomic-embed-text"]

  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    ports:
      - "8000:8000"
    environment:
      # Por defecto exige 2048 MB libres y rechaza con 503 en máquinas con poca RAM.
      UNSTRUCTURED_MEMORY_FREE_MINIMUM_MB: 512

  api:
    build: ./rag-app
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      UNSTRUCTURED_URL: http://unstructured:8000
    depends_on:
      - redis
      - qdrant
      - ollama
      - unstructured

volumes:
  ollama_models: