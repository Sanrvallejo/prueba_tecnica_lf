services:
  redis:
    image: redis:7-alpine

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull llama3.2 && ollama pull nomic-embed-text"]

  api:
    build: ./rag-app
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://qdrant:6333
    depends_on:
      - redis
      - qdrant
      - ollama

volumes:
  ollama_models: